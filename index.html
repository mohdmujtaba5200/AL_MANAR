<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.amazonaws.com; img-src 'self' data:; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="MANĀR: essays and analysis on law, history, society and public life.">
<title>MANĀR | Law, History, Public Life</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1354.0/aws-sdk.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#FDFBF7;--bg-secondary:#F5F2EB;--text-main:#0F172A;--accent-red:#7F1D1D;--accent-amber:#B45309;--border-color:#E2E8F0;--muted:#475569}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-primary);color:var(--text-main);font:400 1.05rem/1.7 'Lora',serif}
a{color:var(--accent-red)}
:focus-visible{outline:3px solid var(--accent-amber);outline-offset:2px}
.skip{position:absolute;left:-999px;background:var(--text-main);color:#fff;padding:8px 14px}.skip:focus{left:8px;top:8px;z-index:9}
.ui{font-family:'Plus Jakarta Sans',sans-serif}
header{text-align:center;padding:32px 20px 18px;border-bottom:2px solid var(--text-main)}
.brand{margin:0;font:700 clamp(2.2rem,7vw,3.4rem)/1.1 'Cinzel',serif;letter-spacing:.04em;color:var(--text-main);text-decoration:none;display:inline-block}
.brand span{font-family:'Amiri',serif;color:var(--accent-red);margin-left:.3em}
.tag{margin:6px 0 0;color:var(--muted);font-style:italic}
nav{background:var(--accent-red);position:sticky;top:0;z-index:5}
.bar{max-width:1200px;margin:auto;padding:8px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cats{display:flex;gap:4px;overflow-x:auto;flex:1}
.cats button{background:none;border:0;color:#fff;font:600 .9rem 'Plus Jakarta Sans',sans-serif;padding:10px 14px;cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
.cats button:hover{background:rgba(255,255,255,.12)}
.cats button[aria-pressed=true]{border-bottom-color:var(--accent-amber);background:rgba(0,0,0,.18)}
.search{padding:9px 12px;border:0;min-width:200px;font:500 .9rem 'Plus Jakarta Sans',sans-serif;background:#fff;color:var(--text-main)}
.wrap{max-width:1200px;margin:32px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr);gap:40px}
.wrap.single{grid-template-columns:minmax(0,1fr);max-width:760px}
.meta{font:500 .85rem 'Plus Jakarta Sans',sans-serif;color:var(--muted);margin:0 0 6px}
.meta b{color:var(--accent-amber);font-weight:600}
.card{padding:24px 0;border-bottom:1px solid var(--border-color)}
.card h2{font:600 1.4rem/1.3 'Lora',serif;margin:0 0 8px}
.card h2 a,.feat h2 a{color:var(--text-main);text-decoration:none}.card h2 a:hover,.feat h2 a:hover{color:var(--accent-red);text-decoration:underline}
.card p{margin:0}
.feat{background:var(--bg-secondary);border-left:4px solid var(--accent-red);padding:28px;margin-bottom:8px}
.feat h2{font:600 clamp(1.7rem,4vw,2.3rem)/1.2 'Lora',serif;margin:0 0 12px}
.more{display:inline-block;margin-top:10px;font:600 .9rem 'Plus Jakarta Sans',sans-serif}
aside .box{background:var(--bg-secondary);border-left:3px solid var(--accent-red);padding:20px;margin-bottom:24px}
aside h3{font:600 1rem 'Cinzel',serif;margin:0 0 8px}
aside ul{list-style:none;margin:0;padding:0}aside li{padding:6px 0;border-bottom:1px solid var(--border-color);font:500 .9rem 'Plus Jakarta Sans',sans-serif}
aside li button{all:unset;cursor:pointer;color:var(--accent-red);width:100%;display:flex;justify-content:space-between}
aside li button:focus-visible{outline:3px solid var(--accent-amber)}
.read h1{font:600 clamp(1.9rem,5vw,2.8rem)/1.2 'Lora',serif;margin:8px 0 12px}
.read .lede{font-style:italic;color:var(--muted);font-size:1.15rem;border-bottom:1px solid var(--border-color);padding-bottom:18px}
.read .body p{margin:0 0 1.2em;max-width:68ch}
.btn{font:600 .9rem 'Plus Jakarta Sans',sans-serif;background:var(--accent-red);color:#fff;border:0;padding:10px 16px;cursor:pointer}
.btn.alt{background:none;color:var(--accent-red);border:1px solid var(--accent-red)}
.sk{height:96px;margin:18px 0;background:linear-gradient(90deg,var(--bg-secondary),#fff,var(--bg-secondary));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:40px 0;text-align:center;color:var(--muted)}
footer{border-top:2px solid var(--text-main);margin-top:40px;padding:24px 20px;text-align:center;font:500 .85rem 'Plus Jakarta Sans',sans-serif;color:var(--muted)}
.sr{position:absolute;left:-999px}
@media(max-width:820px){.wrap{grid-template-columns:1fr;gap:12px}.search{width:100%}aside{order:2}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to articles</a>
<header>
  <a class="brand" href="#/" aria-label="MANĀR home">MANĀR<span lang="ar" dir="rtl">مَنار</span></a>
  <p class="tag">Law, history, society and public life.</p>
</header>
<nav aria-label="Categories and search">
  <div class="bar">
    <div class="cats" id="cats"></div>
    <label class="sr" for="q">Search articles</label>
    <input class="search" id="q" type="search" placeholder="Search titles, authors, text" autocomplete="off">
  </div>
</nav>
<div class="wrap" id="wrap">
  <main id="main" aria-live="polite"></main>
  <aside id="side">
    <div class="box"><h3>About MANĀR</h3><p style="margin:0">Critical essays on law, history and society, written from South Asia and in conversation with the world. <a href="about.html">Read more</a></p></div>
    <div class="box"><h3>Browse by topic</h3><ul id="topics"></ul></div>
  </aside>
</div>
<footer>© <span id="yr"></span> MANĀR · <a href="about.html">About</a> · <a href="admin.html">Editors</a></footer>
<script>
const POOL='ap-south-1:be40eb5b-9951-44d2-a159-6f2846331267',REGION='ap-south-1',TABLE='Articles';
AWS.config.update({region:REGION});
AWS.config.credentials=new AWS.CognitoIdentityCredentials({IdentityPoolId:POOL},{region:REGION});
const db=new AWS.DynamoDB.DocumentClient({region:REGION});
const CATS=['All','Law & Courts','Society','Ideas','Histories'];
let all=[],cat='All',q='',ready=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mins=t=>Math.max(1,Math.round(String(t||'').split(/\s+/).length/220));
const fmt=d=>{const x=new Date(d);return isNaN(x)?'':x.toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})};
const paras=t=>esc(t).split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
const href=a=>'#/a/'+encodeURIComponent(a.id);
const blurb=a=>a.excerpt||String(a.content||'').slice(0,220)+'…';
const meta=a=>`<p class="meta">By ${esc(a.author)} · <b>${esc(a.category)}</b> · ${fmt(a.createdAt)} · ${mins(a.content)} min read</p>`;

async function load(){
  $('#main').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try{
    let items=[],k;
    do{const r=await db.scan({TableName:TABLE,ExclusiveStartKey:k}).promise();items.push(...r.Items);k=r.LastEvaluatedKey}while(k);
    all=items.filter(a=>a&&a.id&&a.title).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
    ready=true;route();
  }catch(e){
    $('#main').innerHTML='<div class="empty"><p><b>The articles could not be loaded.</b><br>Check your internet connection, then try again.</p><button class="btn" id="retry">Try again</button></div>';
    $('#retry').onclick=load;
  }
}
function drawNav(){
  $('#cats').innerHTML=CATS.map(c=>`<button aria-pressed="${c===cat}" data-c="${esc(c)}">${c==='All'?'Latest':esc(c)}</button>`).join('');
  $('#topics').innerHTML=CATS.slice(1).map(c=>`<li><button data-c="${esc(c)}"><span>${esc(c)}</span><span>${all.filter(a=>a.category===c).length}</span></button></li>`).join('');
}
function list(){
  document.title='MANĀR | Law, History, Public Life';
  $('#wrap').className='wrap';$('#side').hidden=false;drawNav();
  const s=q.trim().toLowerCase();
  const rows=all.filter(a=>(cat==='All'||a.category===cat)&&(!s||[a.title,a.author,a.excerpt,a.content].join(' ').toLowerCase().includes(s)));
  if(!rows.length){
    $('#main').innerHTML=`<div class="empty"><p>${all.length?'No articles match your search or topic.':'No articles have been published yet.'}</p>${(s||cat!=='All')?'<button class="btn alt" id="clr">Show all articles</button>':''}</div>`;
    const c=$('#clr');if(c)c.onclick=()=>{q='';cat='All';$('#q').value='';list()};return;
  }
  const head=(!s&&cat==='All')?rows[0]:null,rest=head?rows.slice(1):rows;
  $('#main').innerHTML=(head?`<article class="feat">${meta(head)}<h2><a href="${href(head)}">${esc(head.title)}</a></h2><p>${esc(blurb(head))}</p><a class="more" href="${href(head)}">Read the essay</a></article>`:'')
   +rest.map(a=>`<article class="card">${meta(a)}<h2><a href="${href(a)}">${esc(a.title)}</a></h2><p>${esc(blurb(a))}</p></article>`).join('');
}
function article(id){
  const a=all.find(x=>x.id===id);
  $('#wrap').className='wrap single';$('#side').hidden=true;
  if(!a){$('#main').innerHTML='<div class="empty"><p>This article could not be found. It may have been removed.</p><a class="btn" href="#/">Back to all articles</a></div>';return}
  document.title=a.title+' | MANĀR';
  $('#main').innerHTML=`<article class="read"><a href="#/" class="ui" style="font-weight:600">‹ All articles</a>${meta(a)}<h1>${esc(a.title)}</h1>${a.excerpt?`<p class="lede">${esc(a.excerpt)}</p>`:''}<div class="body">${paras(a.content)}</div><p><button class="btn alt" id="share">Copy link to this article</button></p></article>`;
  $('#share').onclick=async e=>{try{await navigator.clipboard.writeText(location.href);e.target.textContent='Link copied'}catch(_){prompt('Copy this link:',location.href)}};
}
function route(){
  if(!ready)return;
  const m=location.hash.match(/^#\/a\/(.+)$/);
  m?article(decodeURIComponent(m[1])):list();
  window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b)return;
  cat=b.dataset.c;if(location.hash!==''&&location.hash!=='#/')location.hash='#/';else list();
});
$('#q').addEventListener('input',e=>{q=e.target.value;if(/^#\/a\//.test(location.hash))location.hash='#/';else list()});
window.addEventListener('hashchange',route);
$('#yr').textContent=new Date().getFullYear();
drawNav();load();
</script>
</body>
</html>
