<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://*.amazonaws.com; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>MANĀR | Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1354.0/aws-sdk.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg-primary:#FDFBF7;--bg-secondary:#F5F2EB;--text-main:#0F172A;--accent-red:#7F1D1D;--accent-amber:#B45309;--border-color:#E2E8F0;--muted:#475569}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-primary);color:var(--text-main);font:400 1rem/1.6 'Plus Jakarta Sans',sans-serif}
:focus-visible{outline:3px solid var(--accent-amber);outline-offset:2px}
.top{background:var(--accent-red);color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top b{font:700 1.3rem 'Cinzel',serif;margin-right:auto}.top a,.top button{color:#fff}
.page{max-width:820px;margin:28px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--border-color);border-top:4px solid var(--accent-red);padding:28px}
h1,h2{font-family:'Lora',serif;color:var(--accent-red);margin:0 0 16px}
label{display:block;font-weight:600;margin:14px 0 4px}
.hint{font-weight:400;color:var(--muted);font-size:.85rem}
input,select,textarea{width:100%;padding:11px;border:1px solid #94A3B8;font:inherit;background:#fff;color:var(--text-main)}
textarea{font-family:'Lora',serif;line-height:1.6;resize:vertical}
.btn{background:var(--accent-red);color:#fff;border:0;padding:12px 20px;font:600 .95rem inherit;font-family:inherit;cursor:pointer}
.btn:disabled{opacity:.55;cursor:wait}
.btn.alt{background:none;color:var(--accent-red);border:1px solid var(--accent-red)}
.link{background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font:inherit}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tabs button{flex:1;padding:12px;border:1px solid var(--border-color);background:var(--bg-secondary);font:600 .95rem inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:#fff;border-bottom:3px solid var(--accent-amber)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.count{margin-left:auto;color:var(--muted);font-size:.85rem}
.prev{border:1px dashed #94A3B8;padding:16px;margin-top:12px;font-family:'Lora',serif;background:var(--bg-primary)}
.item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--border-color);flex-wrap:wrap}
.item div{flex:1;min-width:200px}.item small{color:var(--muted)}
.item .btn{padding:8px 14px}
.note{background:var(--bg-secondary);border-left:4px solid var(--accent-amber);padding:12px 16px;margin-bottom:16px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text-main);color:#fff;padding:12px 20px;max-width:90%;z-index:9}
#toast.bad{background:var(--accent-red)}
dialog{border:0;border-top:4px solid var(--accent-red);padding:24px;max-width:420px}
dialog::backdrop{background:rgba(15,23,42,.55)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="login" class="page" style="max-width:440px;margin-top:80px">
  <div class="panel">
    <h1>Editor sign-in</h1>
    <p>Enter the editor passcode to write and manage articles.</p>
    <label for="pc">Passcode</label>
    <input id="pc" type="password" autocomplete="current-password">
    <p id="lerr" role="alert" style="color:var(--accent-red);min-height:1.4em;margin:8px 0"></p>
    <button class="btn" id="go">Unlock editor</button>
    <p class="hint" style="margin-top:16px"><a href="index.html">Back to the public site</a></p>
  </div>
</div>

<div id="app" hidden>
  <div class="top"><b>MANĀR Editor</b><a href="index.html" target="_blank" rel="noopener">View public site</a><button class="link" id="out">Log out</button></div>
  <div class="page">
    <div class="tabs" role="tablist">
      <button role="tab" id="t1" aria-selected="true">Write an article</button>
      <button role="tab" id="t2" aria-selected="false">Manage articles</button>
    </div>

    <section id="write" class="panel">
      <h2 id="wh">New article</h2>
      <div id="editing" class="note" hidden><span id="etxt"></span> <button class="link" style="color:var(--accent-red)" id="cancel">Cancel editing</button></div>
      <label for="title">Title</label><input id="title" maxlength="200">
      <label for="author">Author</label><input id="author" maxlength="100">
      <label for="cat">Category</label>
      <select id="cat"><option>Law &amp; Courts</option><option>Society</option><option>Ideas</option><option>Histories</option></select>
      <label for="exc">Summary <span class="hint">(shown on the home page; leave empty to use the opening of the article)</span></label>
      <textarea id="exc" rows="2" maxlength="300"></textarea>
      <label for="body">Article text <span class="hint">(leave a blank line between paragraphs)</span></label>
      <textarea id="body" rows="14"></textarea>
      <div class="row"><span class="count" id="cnt"></span></div>
      <div id="prev" class="prev" hidden></div>
      <div class="row">
        <button class="btn" id="pub">Publish article</button>
        <button class="btn alt" id="pv">Preview</button>
        <button class="btn alt" id="clr">Clear form</button>
        <span class="hint" id="draft"></span>
      </div>
    </section>

    <section id="manage" class="panel" hidden>
      <h2>Published articles</h2>
      <div id="list">Loading…</div>
    </section>
  </div>
</div>

<dialog id="dlg"><h2>Delete this article?</h2><p id="dtxt"></p><p>This cannot be undone.</p>
  <div class="row"><button class="btn" id="dyes">Yes, delete</button><button class="btn alt" id="dno">Keep it</button></div></dialog>
<div id="toast" role="status" hidden></div>

<script>
const POOL='ap-south-1:be40eb5b-9951-44d2-a159-6f2846331267',REGION='ap-south-1',TABLE='Articles';
const SALT='manar-v1:',HASH='73bdbce2b6fe91c953d685bc64aef48f1001f210dac06d7d8e054134a6a17a18';
const MAX_TRIES=5,LOCK_MS=5*60e3,SESSION_MS=30*60e3;
AWS.config.update({region:REGION});
AWS.config.credentials=new AWS.CognitoIdentityCredentials({IdentityPoolId:POOL},{region:REGION});
const db=new AWS.DynamoDB.DocumentClient({region:REGION});
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}},del(k){try{localStorage.removeItem(k)}catch(_){}}};
const sess={get(){try{return +sessionStorage.getItem('mn_s')}catch(_){return 0}},set(v){try{v?sessionStorage.setItem('mn_s',v):sessionStorage.removeItem('mn_s')}catch(_){}}};
let editing=null,timer;

function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className=bad?'bad':'';t.hidden=false;clearTimeout(timer);timer=setTimeout(()=>t.hidden=true,5000)}
function friendly(e){const c=e&&e.code||'';
  if(/AccessDenied|NotAuthorized/i.test(c))return 'AWS refused this action. The Cognito role for this site does not allow it.';
  if(/ResourceNotFound/i.test(c))return 'The "Articles" table was not found in ap-south-1.';
  if(/Network|Timeout|ENOTFOUND/i.test(c))return 'Network problem. Check your connection and try again.';
  return (e&&e.message)||'Something went wrong. Please try again.'}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(SALT+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

/* ---- sign-in ---- */
async function tryLogin(){
  const err=$('#lerr'),st=store.get('mn_lock')||{n:0,until:0};
  if(Date.now()<st.until){err.textContent='Too many attempts. Try again in '+Math.ceil((st.until-Date.now())/60000)+' minute(s).';return}
  if(!(window.crypto&&crypto.subtle)){err.textContent='Open this page over https so sign-in can work.';return}
  if(await sha($('#pc').value)===HASH){store.del('mn_lock');$('#pc').value='';sess.set(Date.now()+SESSION_MS);start()}
  else{st.n++;if(st.n>=MAX_TRIES){st.n=0;st.until=Date.now()+LOCK_MS}store.set('mn_lock',st);err.textContent='That passcode is not correct.'+(st.until>Date.now()?' Sign-in is paused for 5 minutes.':'');$('#pc').select()}
}
function start(){$('#login').hidden=true;$('#app').hidden=false;restoreDraft();count()}
function logout(){sess.set(0);location.reload()}
setInterval(()=>{if(!$('#app').hidden&&Date.now()>sess.get()){toast('Session ended for safety. Please sign in again.',true);setTimeout(logout,1500)}},15000);

/* ---- tabs ---- */
function tab(n){$('#write').hidden=n!==1;$('#manage').hidden=n!==2;$('#t1').setAttribute('aria-selected',n===1);$('#t2').setAttribute('aria-selected',n===2);if(n===2)loadList()}

/* ---- writing ---- */
const words=t=>(t.trim().match(/\S+/g)||[]).length;
function count(){const w=words($('#body').value);$('#cnt').textContent=w+' words · about '+Math.max(1,Math.round(w/220))+' min read'}
function saveDraft(){if(editing)return;store.set('mn_draft',{t:$('#title').value,a:$('#author').value,c:$('#cat').value,e:$('#exc').value,b:$('#body').value});$('#draft').textContent='Draft saved on this device'}
function restoreDraft(){const d=store.get('mn_draft'),au=store.get('mn_author');if(d&&(d.t||d.b)){$('#title').value=d.t;$('#author').value=d.a;$('#cat').value=d.c;$('#exc').value=d.e;$('#body').value=d.b;$('#draft').textContent='Draft restored'}else if(au)$('#author').value=au;count()}
function clearForm(){['title','exc','body'].forEach(i=>$('#'+i).value='');$('#prev').hidden=true;store.del('mn_draft');$('#draft').textContent='';count()}
function stopEditing(){editing=null;$('#editing').hidden=true;$('#wh').textContent='New article';$('#pub').textContent='Publish article';clearForm();restoreDraft()}
function preview(){const p=$('#prev');if(!p.hidden){p.hidden=true;$('#pv').textContent='Preview';return}
  p.innerHTML='<h2 style="color:#0F172A">'+esc($('#title').value||'Untitled')+'</h2><p class="hint">By '+esc($('#author').value)+' · '+esc($('#cat').value)+'</p>'+esc($('#body').value).split(/\n{2,}/).map(x=>'<p>'+x.replace(/\n/g,'<br>')+'</p>').join('');
  p.hidden=false;$('#pv').textContent='Hide preview'}
async function publish(){
  const title=$('#title').value.trim(),author=$('#author').value.trim(),body=$('#body').value.trim();
  if(!title||!author||body.length<50){toast('Add a title, an author and at least a few sentences of article text.',true);return}
  const b=$('#pub');b.disabled=true;const old=b.textContent;b.textContent='Publishing…';
  const now=new Date().toISOString();
  const item={id:editing?editing.id:Date.now().toString(),title,author,category:$('#cat').value,excerpt:$('#exc').value.trim()||body.replace(/\s+/g,' ').slice(0,220)+'…',content:body,createdAt:editing?editing.createdAt:now};
  if(editing)item.updatedAt=now;
  try{await db.put({TableName:TABLE,Item:item}).promise();store.set('mn_author',author);toast(editing?'Article updated.':'Article published.');if(editing)stopEditing();else{clearForm();restoreDraft()}}
  catch(e){toast(friendly(e),true)}
  b.disabled=false;b.textContent=editing?'Save changes':'Publish article';
}

/* ---- managing ---- */
async function loadList(){
  const L=$('#list');L.textContent='Loading…';
  try{let it=[],k;do{const r=await db.scan({TableName:TABLE,ExclusiveStartKey:k}).promise();it.push(...r.Items);k=r.LastEvaluatedKey}while(k);
    it.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));window._items=it;
    L.innerHTML=it.length?it.map(a=>`<div class="item"><div><b>${esc(a.title)}</b><br><small>${esc(a.author)} · ${esc(a.category)} · ${esc(String(a.createdAt).slice(0,10))}</small></div><a class="btn alt" style="text-decoration:none;padding:8px 14px" target="_blank" rel="noopener" href="index.html#/a/${esc(encodeURIComponent(a.id))}">View</a><button class="btn alt" data-e="${esc(a.id)}">Edit</button><button class="btn" data-d="${esc(a.id)}">Delete</button></div>`).join(''):'<p>No articles yet. Use "Write an article" to publish the first one.</p>';
  }catch(e){L.innerHTML='<p>'+esc(friendly(e))+'</p><button class="btn" id="rl">Try again</button>';$('#rl').onclick=loadList}
}
function edit(id){const a=window._items.find(x=>x.id===id);if(!a)return;editing=a;
  $('#title').value=a.title;$('#author').value=a.author;$('#cat').value=a.category;$('#exc').value=a.excerpt||'';$('#body').value=a.content||'';
  $('#wh').textContent='Edit article';$('#editing').hidden=false;$('#etxt').textContent='You are editing "'+a.title+'".';$('#pub').textContent='Save changes';count();tab(1);window.scrollTo(0,0)}
let delId=null;
function askDelete(id){const a=window._items.find(x=>x.id===id);delId=id;$('#dtxt').textContent='"'+a.title+'" will be removed from the public site.';$('#dlg').showModal()}
async function doDelete(){
  $('#dlg').close();
  try{await db.delete({TableName:TABLE,Key:{id:delId}}).promise();toast('Article deleted.');loadList()}catch(e){toast(friendly(e),true)}
}

/* ---- wiring ---- */
$('#go').onclick=tryLogin;$('#pc').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
$('#out').onclick=logout;$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
$('#pub').onclick=publish;$('#pv').onclick=preview;$('#clr').onclick=()=>{if(!editing)clearForm();else stopEditing()};$('#cancel').onclick=stopEditing;
['title','author','cat','exc','body'].forEach(i=>$('#'+i).addEventListener('input',()=>{count();saveDraft()}));
$('#list').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.e)edit(b.dataset.e);if(b.dataset.d)askDelete(b.dataset.d)});
$('#dyes').onclick=doDelete;$('#dno').onclick=()=>$('#dlg').close();
if(sess.get()>Date.now())start();
</script>
</body>
</html>
