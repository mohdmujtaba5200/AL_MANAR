<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MANĀR | Editorial & Admin Portal</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aws-sdk/2.1354.0/aws-sdk.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #FDFBF7;
      --bg-secondary: #F5F2EB;
      --text-main: #0F172A;
      --text-muted: #475569;
      --accent-red: #7F1D1D;
      --accent-amber: #B45309;
      --border-color: #E2E8F0;
      --font-heading: 'Cinzel', serif;
      --font-body: 'Lora', serif;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-primary); color: var(--text-main); font-family: var(--font-body); padding: 40px 20px; line-height: 1.6; }
    
    .portal-container { max-width: 850px; margin: 0 auto; }
    .nav-back { display: inline-block; margin-bottom: 20px; color: var(--accent-red); text-decoration: none; font-family: var(--font-sans); font-weight: 600; font-size: 0.85rem; }
    .nav-back:hover { text-decoration: underline; }

    #login-box { background: white; border: 1px solid var(--border-color); padding: 40px; border-radius: 6px; text-align: center; border-top: 4px solid var(--accent-red); box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
    #login-box h2 { font-family: var(--font-heading); color: var(--accent-red); margin-bottom: 10px; }
    #login-box p { font-family: var(--font-sans); font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
    #login-box input { width: 100%; max-width: 350px; padding: 12px; border: 1px solid #CBD5E1; border-radius: 4px; font-family: var(--font-sans); margin-bottom: 15px; }
    #login-box button { background: var(--accent-red); color: white; border: none; padding: 12px 30px; font-weight: 700; font-family: var(--font-sans); border-radius: 4px; cursor: pointer; }
    #login-box button:hover { background: var(--text-main); }

    .admin-panel { display: none; background: white; border: 1px solid var(--border-color); padding: 35px; border-radius: 6px; border-top: 4px solid var(--accent-red); box-shadow: 0 4px 6px rgba(0,0,0,0.03); }
    h2 { font-family: var(--font-heading); color: var(--accent-red); margin-bottom: 5px; font-size: 1.8rem; }
    .subtitle { font-family: var(--font-sans); font-size: 0.85rem; color: var(--text-muted); margin-bottom: 25px; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }

    label { display: block; font-family: var(--font-sans); font-weight: 600; margin-top: 18px; font-size: 0.9rem; color: var(--text-main); }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #CBD5E1; border-radius: 4px; font-family: var(--font-sans); font-size: 0.95rem; background: #FAFAFA; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-red); background: white; }
    
    .btn-submit { background: var(--accent-red); color: white; border: none; padding: 14px 20px; font-weight: 700; font-family: var(--font-sans); margin-top: 25px; cursor: pointer; width: 100%; border-radius: 4px; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; }
    .btn-submit:hover { background: var(--text-main); }

    .manage-section { margin-top: 50px; border-top: 2px solid var(--border-color); padding-top: 30px; }
    .manage-section h3 { font-family: var(--font-heading); font-size: 1.3rem; margin-bottom: 15px; color: var(--text-main); }
    .manage-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-secondary); padding: 14px 18px; margin-bottom: 10px; border-radius: 4px; font-family: var(--font-sans); font-size: 0.9rem; }
    .btn-delete { background: #EF4444; color: white; border: none; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    .btn-delete:hover { background: #DC2626; }
  </style>
</head>
<body>
  <div class="portal-container">
    <a href="index.html" class="nav-back">&larr; Return to Live Journal</a>

    <div id="login-box">
      <h2>Editorial Authentication</h2>
      <p>Enter the secure editor passcode to access publishing controls.</p>
      <input type="password" id="passcode-input" placeholder="Enter passcode (default: manar2026)">
      <br>
      <button onclick="checkPasscode()">Unlock Portal</button>
    </div>

    <div id="admin-panel" class="admin-panel">
      <h2>MANĀR Editorial Portal</h2>
      <p class="subtitle">Secure Article Submission & Management Console (ap-south-1)</p>
      
      <form id="articleForm">
        <label>Article Title</label>
        <input type="text" id="title" placeholder="e.g. The Language of Sovereignty" required>

        <label>Author Name</label>
        <input type="text" id="author" placeholder="e.g. Uzair Ali" required>

        <label>Category / Section</label>
        <select id="category">
          <option>Law & Courts</option>
          <option>Society</option>
          <option>Ideas</option>
          <option>Histories</option>
          <option>South Asia</option>
          <option>Reviews & Debates</option>
        </select>

        <label>Format Type</label>
        <select id="formatType">
          <option>Essay</option>
          <option>Legal Analysis</option>
          <option>Long Read</option>
          <option>Research Paper</option>
        </select>

        <label>Article Excerpt / Abstract</label>
        <textarea id="excerpt" rows="3" placeholder="Brief summary for homepage layout..."></textarea>

        <label>Full Content</label>
        <textarea id="content" rows="8" placeholder="Paste full article text here..."></textarea>

        <label>Featured Image URL (Optional)</label>
        <input type="text" id="image" placeholder="https://example.com/photo.jpg">

        <label>Embedded Video Link (Optional)</label>
        <input type="text" id="video" placeholder="https://youtube.com/watch?v=...">
        
        <button type="submit" class="btn-submit">Publish Article to Database</button>
      </form>

      <div class="manage-section">
        <h3>Manage Published Articles</h3>
        <div id="admin-articles-list"><p style="font-family: var(--font-sans); color: var(--text-muted);">Loading articles...</p></div>
      </div>
    </div>
  </div>

  <script>
    function checkPasscode() {
      const pass = document.getElementById('passcode-input').value;
      if (pass === 'manar2026') {
        document.getElementById('login-box').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        loadAdminArticles();
      } else {
        alert('Incorrect passcode. Access denied.');
      }
    }

    AWS.config.update({ region: 'ap-south-1' });
    AWS.config.credentials = new AWS.CognitoIdentityCredentials({
      IdentityPoolId: 'ap-south-1:be40eb5b-9951-44d2-a159-6f2846331267'
    });

    function getDynamoDB() {
      return new Promise((resolve, reject) => {
        AWS.config.credentials.get((err) => {
          if (err) reject(err);
          else resolve(new AWS.DynamoDB.DocumentClient({ region: 'ap-south-1' }));
        });
      });
    }

    document.getElementById('articleForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const articleData = {
        id: Date.now().toString(),
        title: document.getElementById('title').value,
        author: document.getElementById('author').value,
        category: document.getElementById('category').value,
        formatType: document.getElementById('formatType').value,
        excerpt: document.getElementById('excerpt').value,
        content: document.getElementById('content').value,
        image: document.getElementById('image').value || '',
        video: document.getElementById('video').value || '',
        createdAt: new Date().toISOString()
      };

      try {
        const dynamodb = await getDynamoDB();
        await dynamodb.put({ TableName: 'Articles', Item: articleData }).promise();
        alert('Article published successfully!');
        this.reset();
        loadAdminArticles();
      } catch (err) {
        console.error('Error publishing article:', err);
        alert('Failed to publish article: ' + err.message);
      }
    });

    async function loadAdminArticles() {
      const listContainer = document.getElementById('admin-articles-list');
      try {
        const dynamodb = await getDynamoDB();
        const data = await dynamodb.scan({ TableName: 'Articles' }).promise();

        if (!data.Items || data.Items.length === 0) {
          listContainer.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No articles found in database.</p>';
          return;
        }

        const articles = data.Items.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        listContainer.innerHTML = articles.map(article => `
          <div class="manage-item">
            <div>
              <strong>${article.title || 'Untitled'}</strong> 
              <span style="color: var(--text-muted);">(${article.author || 'Anonymous'})</span>
            </div>
            <button onclick="deleteArticle('${article.id}')" class="btn-delete">Delete</button>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error loading admin articles:', err);
        listContainer.innerHTML = '<p style="color: #7F1D1D;">Failed to load article management list.</p>';
      }
    }

    async function deleteArticle(articleId) {
      if (!confirm('Are you sure you want to delete this article permanently?')) return;
      try {
        const dynamodb = await getDynamoDB();
        await dynamodb.delete({ TableName: 'Articles', Key: { id: articleId } }).promise();
        alert('Article deleted successfully!');
        loadAdminArticles();
      } catch (err) {
        console.error('Error deleting article:', err);
        alert('Failed to delete article: ' + err.message);
      }
    }
  </script>
</body>
</html>
